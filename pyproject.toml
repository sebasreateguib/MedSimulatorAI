[project]
name = "medsimulator"
version = "0.1.0"
description = "Simulador médico con IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    "openai",
    "asyncpg",
    "sqlalchemy[asyncio]",
    "pgvector",
    "docling",
    # Embeddings (bge-m3) y reranking (cross-encoder bge-reranker-v2-m3).
    "sentence-transformers",
    "rank-bm25",
    "httpx",
    "langfuse",
    "alembic",
    "langchain-text-splitters",
    "pyjwt",
    "bcrypt",
    "email-validator"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
