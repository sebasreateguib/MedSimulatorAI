<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MedSimulator AI">
  <title>MedSimulator AI</title>
  <!-- Placa de tinta: el mismo mark que la cabecera, en versión sólida. -->
  <rect width="32" height="32" fill="#171310"/>
  <!-- Filete hueso: mantiene el ícono legible sobre pestañas oscuras. -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#F0EAE0" stroke-opacity=".24" stroke-width="1"/>
  <!-- Cruz clínica, grabada en hueso. -->
  <path d="M13.5 6h5v20h-5zM6 13.5h20v5H6z" fill="#F0EAE0"/>
</svg>
