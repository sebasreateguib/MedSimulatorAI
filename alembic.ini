[alembic]
script_location = medsimulator/db/migrations
# La URL la resuelve env.py desde el entorno (DATABASE_URL, o
# ALEMBIC_DATABASE_URL para apuntar a otra base sin tocar la de la app).
# Dejarla escrita acá era el camino corto a migrar la base equivocada.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
