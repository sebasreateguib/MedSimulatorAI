<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MedSimulator AI">
  <title>MedSimulator AI</title>
  <!-- Lámina de tinta. -->
  <rect width="32" height="32" fill="#171310"/>
  <!-- Cuadrante inferior derecho: el caso sin resolver. -->
  <path d="M18.5 18.5H32V32H18.5z" fill="#A33224"/>
  <!-- Cruz clínica, sangrada a los cuatro bordes. -->
  <path d="M13.5 0h5v32h-5zM0 13.5h32v5H0z" fill="#F0EAE0"/>
  <!-- Filete hueso: mantiene la lámina legible sobre pestañas oscuras. -->
  <rect x=".5" y=".5" width="31" height="31" fill="none" stroke="#EDE5D7" stroke-opacity=".14"/>
</svg>
