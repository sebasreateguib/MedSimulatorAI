paciente:    {provider: groq,       model: openai/gpt-oss-120b,     temperature: 0.8}
router:      {provider: groq,       model: openai/gpt-oss-20b,      temperature: 0.0}
# El tutor corre sobre Opus contra la API nativa de Anthropic. Eso le da
# structured outputs —el scorecard llega validado contra EvaluacionClinica, sin
# pedir el schema por prompt ni parsear a mano— y saca el fee de OpenRouter.
# `temperature` no va: Opus 5 la eliminó y devuelve 400 si se la manda; el
# equivalente es `effort`, que regula cuánto razona antes de puntuar.
# Requiere ANTHROPIC_API_KEY cargada. Para volver a OpenRouter basta con
# `{provider: openrouter, model: anthropic/claude-opus-5, temperature: 0.0}`:
# el agente bifurca solo y la ruta compatible con OpenAI sigue intacta.
tutor:       {provider: anthropic, model: claude-opus-5, max_tokens: 2000, effort: high}
# Las citations nativas solo existen en la API de Anthropic, y ANTHROPIC_API_KEY
# está vacía: con `provider: anthropic` el validador arranca y falla en cada
# llamada. Corre entonces sobre Groq con verificación casera —el modelo cita y
# el código comprueba que la cita esté de verdad en el chunk—. Para volver a las
# citations nativas: cargar la key y poner
# `{provider: anthropic, model: claude-opus-5, citations: true}`.
validador:   {provider: groq,       model: openai/gpt-oss-120b,     temperature: 0.0}
especialista: {provider: openrouter, model: deepseek/deepseek-chat}
estudio:     {provider: groq,       model: openai/gpt-oss-120b,     temperature: 0.3}
flashcards:  {provider: groq,       model: openai/gpt-oss-120b,     temperature: 0.4}
# Único agente multimodal: describe las imágenes que el OCR no puede leer.
vision:      {provider: openrouter, model: google/gemini-2.5-flash-lite, max_tokens: 1200}
